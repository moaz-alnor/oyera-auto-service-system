name: Bug report
description: Report reproducible incorrect behavior in OYERA.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, database URLs, API keys, or real customer data.

  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options:
        - Administrator
        - Manager
        - Receptionist
        - Senior Technician
        - Technician
        - Cashier
        - Not role-specific
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area / page
      placeholder: e.g. Inventory reservation or /inventory/...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, local/Render, commit SHA if known

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Remove credentials and private customer information first.

  - type: checkboxes
    id: safety
    attributes:
      label: Security and privacy
      options:
        - label: I removed passwords, secrets, database URLs, and private customer data.
          required: true
        - label: This is not a security vulnerability; vulnerabilities must be reported privately.
          required: true
