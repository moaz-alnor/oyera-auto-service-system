name: oyera-production

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      OYERA_APP_DB_USER: ${POSTGRES_USER}
      OYERA_APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-oyera-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DJANGO_STATIC_ROOT: /app/src/staticfiles
      DJANGO_MEDIA_ROOT: /var/lib/oyera/media
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      OYERA_RUN_MIGRATIONS: ${OYERA_RUN_MIGRATIONS:-true}
      OYERA_COLLECT_STATIC: ${OYERA_COLLECT_STATIC:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/oyera/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - scripts/container_healthcheck.py
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 60s
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OYERA_DOMAIN: ${OYERA_DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${OYERA_HTTP_PORT:-80}:80"
      - "${OYERA_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
