<aside
    class="app-sidebar"
    aria-label="Application navigation"
>
    <nav class="sidebar-nav">
        <p class="sidebar-nav__label">
            Operations
        </p>

        <a
            class="sidebar-nav__link
                {% if request.resolver_match.app_name == 'core' %}
                    sidebar-nav__link--active
                {% endif %}
            "
            href="{% url 'core:dashboard' %}"
        >
            Dashboard
        </a>

        {% if perms.customers.view_customer %}
            <a
                class="sidebar-nav__link
                    {% if request.resolver_match.app_name == 'customers' %}
                        sidebar-nav__link--active
                    {% endif %}
                "
                href="{% url 'customers:list' %}"
            >
                Customers
            </a>
        {% endif %}

        {% if request.user.is_staff %}
            <p class="sidebar-nav__label">
                Administration
            </p>

            <a
                class="sidebar-nav__link"
                href="{% url 'admin:index' %}"
            >
                Django administration
            </a>
        {% endif %}
    </nav>
</aside>
