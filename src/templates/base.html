{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Oyera Auto Service Bay records-management system"
    >

    <title>
        {% block title %}
            Oyera Auto Service
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/tokens.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/layout.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/components.css' %}"
    >

    {% block extra_head %}
    {% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <a
        class="skip-link"
        href="#main-content"
    >
        Skip to main content
    </a>

    {% block body %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}
</body>
</html>
