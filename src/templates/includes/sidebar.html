<aside

>

        <p class="sidebar-nav__label">
            Operations
        </p>

        <a
            class="sidebar-nav__link sidebar-nav__link--active"
            href="{% url 'core:dashboard' %}"

        {% if request.user.is_staff %}

            <a

            >
                Django administration
