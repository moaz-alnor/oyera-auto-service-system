version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 5
    target-branch: main
    ignore:
      - dependency-name: django
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 5
    target-branch: main

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 5
    target-branch: main
